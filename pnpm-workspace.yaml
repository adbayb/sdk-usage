packages:
    - "applications/*"
    - "examples/*"
    - "libraries/*"
saveExact: true
verifyDepsBeforeRun: "warn"
update:
    githubActions: true
minimumReleaseAgeExclude:
    - "@adbayb/*"
publicHoistPattern:
    - "*changesets*"
    - "*commitlint*"
    - "*oxfmt*"
    - "*oxlint*"
    - "*turbo*"
    - "*typescript*"
    - "*types*"
permissions:
    "@adbayb/stack":
        skills: true
    "@swc/core":
        build: true
skills:
    dirs:
        - .agents/skills
