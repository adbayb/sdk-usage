packages:
    - "applications/*"
    - "examples/*"
    - "libraries/*"
saveExact: true
verifyDepsBeforeRun: "warn"
allowBuilds:
    "@swc/core": true
update:
    githubActions: true
minimumReleaseAgeExclude:
    - "@adbayb/*"
publicHoistPattern:
    - "*changesets*"
    - "*commitlint*"
    - "*oxfmt*"
    - "*oxlint*"
    - "*turbo*"
    - "*typescript*"
    - "*types*"
permissions:
    "@adbayb/stack":
        skills: true
